<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question For You</title>
  <style>
    :root {
      --primary: #e63946;
      --soft-pink: #ffe6e8;
      --accent: #ff758c;
      --text-dark: #2b2d42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-dark);
      padding: 20px;
      overflow-x: hidden;
    }

    /* Floating Hearts Background */
    .heart-bg {
      position: fixed;
      top: -10%;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 0;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(360deg);
      }
    }

    /* Main Container Card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    /* Photo Frame */
    .photo-frame {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--accent);
      box-shadow: 0 8px 20px rgba(230, 57, 70, 0.25);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      color: #d62828;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #4a4e69;
      margin-bottom: 25px;
    }

    /* Interactive Memory Slideshow */
    .memory-box {
      background: var(--soft-pink);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }
